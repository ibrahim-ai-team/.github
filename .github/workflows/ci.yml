name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Job names are required status-check contexts in .github/rulesets/main-protection.json.
# Checkout uses built-in Git to avoid third-party action dependencies.
jobs:
  yaml-lint:
    name: yaml-lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout source with built-in Git
        env:
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
        run: |
          git init -q .
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$REF"
          git checkout -q --detach FETCH_HEAD
      - name: Validate issue forms, ruleset, and Dependabot config
        run: python scripts/validate_repo.py yaml

  markdown-lint:
    name: markdown-lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout source with built-in Git
        env:
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
        run: |
          git init -q .
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$REF"
          git checkout -q --detach FETCH_HEAD
      - name: Check Markdown links and board-mapping duplication
        run: python scripts/validate_repo.py markdown
      - name: Unit-test governance scripts
        run: python -m unittest discover -s tests -v
      - name: Check board mapping against ai-software-team TaskStatus
        run: |
          git clone -q --depth=1 https://github.com/ibrahim-ai-team/ai-software-team.git ../ai-software-team
          python scripts/check_state_drift.py --impl-repo ../ai-software-team

  protection-check:
    name: protection-check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout source with built-in Git
        env:
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
        run: |
          git init -q .
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$REF"
          git checkout -q --detach FETCH_HEAD
      - name: Verify live repository hardening (warning-only without authenticated gh)
        run: scripts/verify_repo_hardening.sh --ci
