name: Task
description: Track a bounded piece of work or maintenance activity.
type: Task
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not include passwords, tokens, private user data, or sensitive vulnerability details; report vulnerabilities privately as described in [SECURITY.md](https://github.com/ibrahim-ai-team/.github/blob/main/SECURITY.md)."
  - type: textarea
    id: problem
    attributes:
      label: Problem or context
      description: Why is this work needed?
      placeholder: Describe the current situation and impact.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: What should be true when this is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Include what is in scope and out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable criteria.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, risks, and next action
      description: Mention related issues and blockers, or write "None known".
    validations:
      required: true
