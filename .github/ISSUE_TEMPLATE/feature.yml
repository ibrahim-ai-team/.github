name: Feature
description: Propose a capability or meaningful improvement.
labels: ["enhancement"]
type: Feature
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not include passwords, tokens, private user data, or sensitive vulnerability details; report vulnerabilities privately as described in [SECURITY.md](https://github.com/ibrahim-ai-team/.github/blob/main/SECURITY.md)."
  - type: textarea
    id: opportunity
    attributes:
      label: Problem or opportunity
      description: Who needs this and why?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the value and expected behavior.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable criteria.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Urgent
        - P1 - Foundation
        - P2 - Important
        - P3 - Later
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Estimate
      description: Optional. Leave blank if unsure; a maintainer will estimate during triage.
      options:
        - XS
        - S
        - M
        - L
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, risks, and next action
      description: Mention related issues and blockers, or write "None known".
    validations:
      required: true
