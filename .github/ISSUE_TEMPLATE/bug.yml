name: Bug
description: Report a reproducible defect.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, private user data, or sensitive vulnerability details. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What is wrong and what is the impact?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Environment and evidence
      description: Include versions, sanitized logs, screenshots, or test output. Remove secrets and personal data.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Urgent
        - P1 - Foundation
        - P2 - Important
        - P3 - Later
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround, dependencies, and next action
      description: State a workaround if known, related issues, or "None known".
    validations:
      required: true
