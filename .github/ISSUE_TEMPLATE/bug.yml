name: Bug
description: Report a reproducible defect.
labels: ["bug"]
# Native GitHub Issue Type requires plan support and organization configuration.
# If unsupported, use the existing bug label as the fallback; verify live support before changing this field.
type: Bug
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not include passwords, tokens, private user data, or sensitive vulnerability details; report vulnerabilities privately as described in [SECURITY.md](https://github.com/ibrahim-ai-team/.github/blob/main/SECURITY.md)."
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What is wrong and what is the impact?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Environment and evidence
      description: Include versions, sanitized logs, screenshots, or test output. Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround and related issues
      description: Optional. A known workaround, or links to related issues.
    validations:
      required: false
